  effect:
    label: Efectos CSS
    type: select
    options:
      creatable: true
      multiple: true
      values:
        [
          ## --- Opacidad ---
          { value: "opacity: 0;", label: "Invisible (opacidad 0%)" },
          { value: "opacity: 0.5;", label: "Semitransparente (opacidad 50%)" },
          { value: "opacity: 0.8;", label: "Casi opaco (opacidad 80%)" },

          ## --- Escala ---
          { value: "transform: scale(0.8);", label: "Reducir tamaño (80%)" },
          { value: "transform: scale(1.2);", label: "Aumentar tamaño (120%)" },
          { value: "transform: scaleX(1.5);", label: "Ensanchar (150%)" },
          { value: "transform: scaleY(0.5);", label: "Comprimir vertical (50%)" },

          ## --- Rotación ---
          { value: "transform: rotate(6deg);", label: "Rotar 6°" },
          { value: "transform: rotate(-6deg);", label: "Rotar -6°" },
          { value: "transform: rotate(90deg);", label: "Rotar 90°" },
          { value: "transform: rotate(180deg);", label: "Rotar 180°" },

          ## --- Posición / desplazamiento ---
          { value: "transform: translateX(-20%);", label: "Desplazar izquierda" },
          { value: "transform: translateX(20%);", label: "Desplazar derecha" },
          { value: "transform: translateY(-20%);", label: "Desplazar arriba" },
          { value: "transform: translateY(20%);", label: "Desplazar abajo" },
          { value: "transform: translate(-50%, -50%);", label: "Centrar" },

          ## --- Filtros ---
          { value: "filter: blur(5px);", label: "Desenfocar (5px)" },
          { value: "filter: brightness(1.2);", label: "Más brillo (120%)" },
          { value: "filter: brightness(0.7);", label: "Oscurecer (70%)" },
          { value: "filter: contrast(150%);", label: "Más contraste (150%)" },
          { value: "filter: grayscale(100%);", label: "Escala de grises" },
          { value: "filter: sepia(100%);", label: "Sepia" },
          { value: "filter: saturate(200%);", label: "Más saturación" },
          { value: "filter: invert(100%);", label: "Invertir colores" },
          { value: "filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));", label: "Sombra suave" },

          ## --- Bordes y esquinas ---
          { value: "border-radius: 8px;", label: "Esquinas redondeadas" },
          { value: "border-radius: 9999px;", label: "Esquinas totalmente redondeadas" },
          { value: "border: 2px solid rgb(var(--color-accent));", label: "Borde de acento" },

          ## --- Sombras ---
          { value: "box-shadow: 0 4px 6px rgba(0,0,0,0.1);", label: "Sombra ligera" },
          { value: "box-shadow: 0 10px 20px rgba(0,0,0,0.25);", label: "Sombra pronunciada" },

          ## --- Tipografía ---
          { value: "font-weight: bold;", label: "Negrita" },
          { value: "font-style: italic;", label: "Cursiva" },
          { value: "text-decoration: underline;", label: "Subrayado" },
          { value: "text-transform: uppercase;", label: "Mayúsculas" },
          { value: "letter-spacing: 2px;", label: "Espaciado entre letras" },
          { value: "text-align: center;", label: "Centrar texto" },

          ## --- Color ---
          { value: "color: rgb(var(--color-accent));", label: "Color de acento" },
          { value: "background-color: rgb(var(--color-accent));", label: "Fondo de acento" },

          ## --- Interacción / cursor ---
          { value: "cursor: pointer;", label: "Cursor de mano" },
          { value: "pointer-events: none;", label: "Deshabilitar interacción" },
          { value: "user-select: none;", label: "Deshabilitar selección de texto" },

          ## --- Visibilidad / display ---
          { value: "display: none;", label: "Ocultar elemento" },
          { value: "visibility: hidden;", label: "Ocultar (mantener espacio)" },

          ## --- Transición (para que los cambios se animen) ---
          { value: "transition: all 0.3s ease;", label: "Transición suave" },

          ## --- Padding (alineado a la escala de Tailwind) ---
          { value: "padding: 0.5rem;", label: "Relleno pequeño" },
          { value: "padding: 1rem;", label: "Relleno medio" },
          { value: "padding: 2rem;", label: "Relleno grande" },
          { value: "padding-top: 1.5rem;", label: "Espacio arriba" },
          { value: "padding-bottom: 1.5rem;", label: "Espacio abajo" },

          ## --- Margin ---
          { value: "margin: 0;", label: "Sin margen" },
          { value: "margin: 0 auto;", label: "Centrar horizontalmente" },
          { value: "margin-top: 2rem;", label: "Margen arriba" },
          { value: "margin-bottom: 2rem;", label: "Margen abajo" },

          ## --- Tamaño de texto ---
          { value: "font-size: 0.875rem;", label: "Texto pequeño" },
          { value: "font-size: 1.25rem;", label: "Texto grande" },
          { value: "font-size: 2rem;", label: "Texto extra grande" },
        ]
  hero:
    label: Hero
    type: object
    fields:
      - { name: title, label: Título, type: string }
      - { name: description, label: Subtitulo, type: string }
      - { name: image, label: Image, type: image }
      - name: elements
        label: Acciones
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
        fields:
          - { name: title, label: Título, type: string }
          - { name: link, label: Accion, type: string }
  gallery:
    label: Galleria imagenes
    type: object
    fields:
      - { name: title, label: Título, type: string }
      - { name: description, label: Subtitulo, type: string }
      - name: elements
        label: Elementos
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" }, sort: "manual", modal: false }
        fields:
          - { name: title, label: Título, type: string }
          - { name: description, label: Subtitulo, type: string }
          - { name: image, label: Imagen, type: image }
          - { name: type, label: tipo de bloque, component: blocktype }
  event:
    label: Evento
    type: object
    fields:
      - { name: title, label: Título/Nombre del evento, type: string }
      - { name: images, label: Imagenes, type: image, options: { multiple: true } }
      - { name: description, label: Descripción, type: rich-text }
      - { name: location, label: Lugar, component: location }
      - { name: date, label: Fecha, type: date }
      - { name: times, label: Hora, component: times }
      - { name: rrule, label: Se repite, component: rrule }
      - { name: duration, label: Duración (min), type: number }
      #- { name: celebrants, label: Celebrantes, type: select, options: {  multiple: true, source: "info.collaborators" } }
  exception:
    label: Excepción
    type: object
    fields:
      - { name: newTime, label: Nueva hora, component: times }
      - { name: newPlace, label: Nuevo lugar, component: location }
      #- { name: celebrants, label: Celebrantes, type: select, options: {  multiple: true, source: "info.collaborators" } }
  page:
    label: Página
    type: object
    fields:
        - { name: id, label: Identificador, type: uuid, hidden: true }
        - { name: title, label: Título, type: string }
        - { name: description, label: Subtitulo, type: string }
        - { name: image, label: Imagen, type: image }
        #- { name: hideHero, label: Esconder cabezera por defecto, type: boolean, default: false }
        - name: sections
          label: Secciones de la página
          type: block
          list: { collapsible: { collapsed: true, summary: "{fields.title}" },  modal: true }
          blocks:
            - name: accordion
              label: FAQ
              fields:
                - { name: title, type: string, label: Titulo sección, default: "Preguntas frecuentes" }
                - name: elements
                  label: Preguntas y respuestas
                  type: object
                  list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
                  fields:
                    - { name: title, label: Pregunta, type: string }
                    - { name: html, label: Respuesta, type: rich-text }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: scrollyTelling
              label: Narración interactiva
              fields:
                - { name: title, type: string, label: Titulo de la narración }
                - name: elements
                  label: Viñetas
                  type: object
                  list: { collapsible: { collapsed: true } }
                  fields:
                    - { name: text, label: Texto, type: rich-text }
                    - { name: image, label: Imagen, type: image }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: gallery
              label: Galeria de imagenes
              fields:
                - { name: title, type: string, label: Titulo sección }
                - { name: images, type: image, label: Seleccion de imagenes, options: { multiple: true } }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: text
              label: Texto
              fields:
                - { name: title, type: string, label: Titulo sección }
                - { name: html, label: Texto largo, type: rich-text }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: gospel
              label: Evangelio del día
              fields:
                - { name: title, type: string, label: Titulo sección, default: "Evangelio de hoy" }
                - { name: readings, label: Mostrar primera/segunda y salmo, type: boolean, default: false }
                - { name: audio, label: Añadir audio, type: boolean, default: false }
                - { name: images, label: Mostrar imagenes, type: boolean, default: true }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: calendar
              label: Eventos
              fields:
                - { name: title, type: string, label: Titulo sección, default: "Nuestros eventos" }
                - { name: filter, label: "Filtro. ¿Qué eventos quieres mostrar?", component: calendarFilter }
                - { name: ordering, label: "Agrupación de eventos. ¿Cómo quieres agruparlos?", component: ordering }
                #- { name: orderTabla, label: "Dividir en tablas según:", component: orderSelect }
                #- { name: orderFila, label: "Dividir en filas según:", component: orderSelect }
                #- { name: orderColumna, label: "Dividir en columnas según:", component: orderSelect }
                #- { name: orderSubfila, label: "Dividir en subfila según:", component: orderSelect }
                #- { name: orderNotas, label: "Añadir notas según:", component: orderSelect }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: video-gospel
              label: Audios Nuevo Testamento
              fields:
                - { name: title, type: string, label: Titulo sección, default: "Audios Nuevo Testamento" }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: video-podcast
              label: Podcast católicos
              fields:
                - { name: title, type: string, label: Titulo sección, default: "Descubre tu fe" }
                - { name: links, label: Podcast, component: podcast }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: video-channel
              label: Canal de Youtube
              fields:
                - { name: title, type: string, label: Titulo sección }
                - { name: filter, label: Filtro. Incluir solo videos que contengan, type: string }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: video-instagram
              label: Cuenta de instagram
              fields:
                - { name: title, type: string, label: Titulo sección }
                - { name: filter, label: Filtro. Incluir solo posts que contengan, type: string }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: town
              label: Lista de templos/pueblos
              fields:
                - { name: title, type: string, label: Titulo sección, default: "Nuestros pueblos" }
                - { name: filters, label: Filtros a mostrar, type: select, options: { multiple: true, creatable: true } }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: video
              label: Lista de videos/audios
              fields:
                - { name: title, type: string, label: Titulo sección }
                - { name: links, label: Enlaces externos, type: string, list: { collapsible: { collapsed: true } } }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: map
              label: Mapa
              fields:
                - { name: title, type: string, label: Título sección, default: 'Ven a conocernos' }
                - { name: geo, type: string, label: "Coordenadas (ej: 42.801941, -1.645660)" }
                - { name: name, type: string, label: Nombre }
                - { name: image, type: image, label: Imagen }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: fundraising
              label: Campaña financiación
              fields:
                - { name: title, type: string, label: Titulo sección, default: "Ayudanos a llegar a más" }
                - { name: name, type: string, label: "Nombre causa (ej: Nuevo tejado)" }
                - { name: description, type: string, label: Descripcion }
                - { name: raised, type: number, label: Recaudado hasta la fecha }
                - { name: goal, type: number, label: Total a recaudar }
                - { name: action, type: string, label: Nombre acción, hidden: true, default: Donar }
                - { name: image, type: image, label: Imagen }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: hero
              label: Cabezera de sección
              component: hero
            - name: team
              label: Miembros del equipo
              fields:
                - { name: title, type: string, label: Titulo sección, default: "Nuestro equipo parroquial" }
                - { name: tags, label: Opciones de estilo, component: tags }
            - name: links
              label: Enlaces internos
              fields:
                - { name: title, type: string, label: Titulo sección }
                - name: links
                  type: select
                  options: { source: "pages.list", multiple: true, label: "{title}" }
                - { name: tags, label: Opciones de estilo, component: tags }


content:
  - name: calendar
    icon: calendar
    type: tab
    label: Eventos
    fields:
      # `calendario` is a custom field type rendered by CalendarEditor.vue
      # (see FieldRenderer's `field.type === 'calendario'` branch)
      - name: events
        type: calendario
        label: Calendario de eventos
        options:
          eventTypesPath: "event-types.list"   # config dot-path to the event-types array
          eventFields: "event"                 # components entry providing the event field set
          keyList: "list"                      # events doc sub-key holding the array
          keyCelebrants: "celebrants"          # events doc sub-key holding the celebrant list
          keyDefaults: "defaults"              # events doc sub-key holding the per-type defaults map

  - name: event-types
    icon: false # this hides the tab
    type: tab
    label: Tipos de Evento
    fields:
      - name: list
        label: Tipos de evento
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.label}"
          sort: 'alphabetical'
        fields:
          - { name: id, label: Identificador, type: uuid, hidden: true }
          - { name: label, label: "Tipo de evento (ej: Eucaristía)", type: string }
          - { name: icon, label: Icono (se mostrará unicamente en este editor), type: icon }
          - { name: defaults, label: "Valores por defecto para evento de este tipo",component: event }
          #- { name: protected, label: 'Elemento protegido/imborrable (dev only, ira escondido)', type: text }

  - name: nerdy
    icon: false # hidden tab: edit whole config as JSON
    type: tab
    label: Nerdy
    fields:
      - name: rawJson
        label: JSON completo
        type: text

  - name: info
    icon: identification
    type: tab
    label: Datos
    fields:
      - { name: title, label: Título del sitio web, type: string }
      - { name: description, label: Breve descripción del sitio web, type: text }
      - name: collaborators
        label: Lista de colaboradores
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.name}" } }
        fields:
          - { name: name, label: Nombre, type: string }
          - { name: phonenumber, label: "Número teléfono", type: string }
          - { name: image, label: Foto, type: image }
          - name: social
            label: Otra información de contacto (email, instagram....)
            type: string
            list: { collapsible: { collapsed: true } }
          
      - name: places
        label: Lista de templos
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.name}" }, sort: "alphabetical", modal: false }
        fields:
          - { name: name, type: string, label: Nombre }
          - { name: images, type: image, label: Imagenes, options: { multiple: true } }
          - { name: geo, type: string, label: "Coordenadas (ej: 42.801941, -1.645660)" }
          - { name: address, type: string, label: "Dirección" }
          - name: tags
            label: Otros valores
            type: object
            list: { collapsible: { collapsed: true, summary: "{{fields.key}} => {fields.value}" }, sort: "alphabetical" }
            fields:
              - name: key
                label: Clave
                type: select
                options:
                  multiple: false
                  creatable: true
                  values:
                    [
                      { value: "video", label: "Vídeo" },
                      { value: "dates", label: "Fechas" },
                    ]
              - { name: value, label: Valor, type: string }
      - name: autodiscover
        label: Encontrar templos
        type: places-autodiscover
        options:
          listPath: "places"                     # field (relative to this tab) where selected places are appended
          eventsPath: "calendar.events.list"   # config dot-path to the events ARRAY to import into
      - name: bank
        label: Bizum y cuentas bancarias
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
        fields:
          - { name: title, label: "Nombre (ej: BIZUM/BBVA/...)", type: string }
          - { name: account, label: Número de cuenta/bizum, type: string }
      - name: social
        label: Redes sociales, youtube...
        type: string
        list: { collapsible: { collapsed: true } }

  - name: pages
    icon: document-text
    label: Páginas
    type: tab
    fields:
      - name: list
        label: Lista de páginas
        component: page
        list: { collapsible: { collapsed: true, summary: "{fields.title}" }, sort: "alphabetical", modal: true  }
      - { name: pageperlocatoin, label: Crear una página para cada templo, type: boolean, default: true }  
      - { name: pageperevent, label: Crear una página para cada evento de tipo, type: select, options: { source: "event-types.list", multiple: true, label: "{title}" }  }  
      - name: nav
        label: Menu de navegación
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
        fields:
          - { name: title, label: Titulo del submenu, type: string }
          - name: links
            label: Enlaces
            type: select
            options: { source: "pages.list", multiple: true, label: "{title}" }
      - name: languages
        label: Idiomas de la web
        component: languages

  - name: theme
    label: Diseño
    icon: fluent-mdl2:color-solid
    type: tab
    fields:
      - { name: image, label: Imagen del sitio, type: image }
      - { name: icon, label: Icono del sitio, type: image }
      - name: accentColor
        label: "Color elementos acentuados"
        type: color
        options: { themeRole: accent }
      #- name: accentPrimary
      #  label: "Color secundario"
      #  type: color
      #  options: { themeRole: primary }
      - name: headingFont
        label: "Tipo de letra de los titulos"
        component: font
        options: { themeRole: heading }
      - name: bodyFont
        label: "Tipo de letra del cuerpo"
        component: font
        options: { themeRole: body }
      - { name: navStyle, label: "Estilo de la barrra de navegación", component: navigationBar }
      - { name: footerStyle, label: "Estilo de pie de página", component: footerStyle }
      - { name: radius, label: "Redondez de elementos", component: radiusSelect, options: { themeRole: radius } }
      #- { name: shadow, label: "Intensidad de sombras", component: shadowSelect, options: { themeRole: shadow } }
      - { name: buttonStyle, label: "Estilo de botones", component: buttonStyle, options: { themeRole: buttonStyle } }

      - name: styles
        label: Estilos para cada elemento
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.selector}" } }
        fields:
          - { name: selector, label: "Lista de elementos", component: selector }
          - { name: cssClass, label: "Efecto a aplicar", component: effect }
          - { name: scroll, label: "Aplicar al hacer desplazar (transición)", type: boolean, default: false }

      # `preview` is a custom field type rendered by Preview.vue
      # (see FieldRenderer's `field.type === 'preview'` branch)
      #- name: preview
      #  type: preview
      #  label: Visualiza los estilos
      #  options:
      #    styles: "theme"   # location of the 
