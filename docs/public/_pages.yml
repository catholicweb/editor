  }
  "motionIntensity": {
    "description": "Single 0-10 dial driving ALL motion: animation magnitude (duration/distance/scale), which elements get a scroll-reveal effect and how many, and the hover effect. Low = fewer elements, subtler effects. High = more elements, more dramatic effects (blur-in headings, slide-in quotes, combined zoom+glow hover). Implemented with pure CSS scroll-driven animations (animation-timeline: view()), wrapped in @supports so unsupported browsers just render static content — no JS, fails silently. 0 disables motion entirely.",
    "type": "slider",
    "min": 0,
    "max": 10,
    "step": 1,
    "default": null,
    "marks": [
      {
        "value": 0,
        "label": "Sin animaciones"
      },
      {
        "value": 10,
        "label": "Dramático"
      }
    ],
    "customValueHint": "integer 0-10"
  }
