settings:
  content:
    merge: true
  hide: true
components:
  text:
    label: Text Content
    type: rich-text
  calendarFilter:
    label: Filtro calendario
    help: |-
      Decide qué eventos del calendario aparecen en esta sección. Elige una de las opciones o escribe una expresión propia.
      Una expresión combina condiciones con & ("y"); el prefijo ! niega la condición; campo:empty significa «ese campo está vacío» (por ejemplo, !byday:empty = eventos que se repiten); una palabra suelta (mass, funeral) mantiene solo los eventos que la contienen.
      Los marcadores {name}, {title} y {type} se sustituyen por el templo, el evento o el grupo de eventos de la página donde se muestra la sección, así que la misma sección sirve en muchas páginas.
    type: select
    options:
      multiple: false
      creatable: true
      # Same wording pattern everywhere: "Solo ..." keeps only those events, "Todos excepto ..." hides them.
      # Grouped by what they look at: kind of event, how often it happens, and the page the section is on.
      # The values are stored in sites' config.json (and `mass` also drives the default grouping in
      # web-template's assembleOrder): never change a value, only its label.
      values:
        [
          { value: 'mass', label: "Solo misas" },
          { value: 'funeral', label: "Solo funerales" },
          { value: '!mass', label: "Todos excepto misas" },
          { value: "!dates:empty&byday:empty", label: 'Solo eventos puntuales (con fecha, sin repetirse)' }, # has a date and does not repeat
          { value: '!byday:empty', label: "Solo eventos periódicos (que se repiten)" }, # check is repeating only (start date is okay on repeating events)
          { value: '!byday:empty&!mass', label: "Solo eventos periódicos, excepto misas" },
          { value: "{name}", label: 'Solo los del templo de esta página' },
          { value: "{title}", label: 'Solo los del evento de esta página' },
          { value: '"type":"{type}"', label: 'Solo los del grupo de eventos de esta página' },
        ]
  ordering:
    # Legacy: the editor no longer shows this field (the calendar section's `ordering` is `hidden: true`).
    # It stays in the schema so existing values are kept and still validate.
    label: Criterio agrupación
    help: |-
      Opcional; el editor ya no lo muestra y casi nunca hace falta rellenarlo. Si está vacío, la web elige la agrupación según el filtro de la sección (solo misas: Laborable/Festivo > Horas > Lugares > Notas; cualquier otro: Tipo de evento > Día o fecha > Horas > Extras).
      Si se rellena (sitios antiguos), define cómo se agrupan y ordenan los eventos en las tablas de la sección. Es una lista de 5 criterios separados por comas: de izquierda a derecha, cada criterio es una columna o nivel de agrupación (title, dates, times, locations, byday, notes, weekday, byweek, language). Los símbolos especiales (skip, + y -) forman parte de las combinaciones predefinidas.
    type: select
    options:
      multiple: false
      creatable: true
      values:
        [
          { value: "title,dates,skip,times,locations", label: "Título > Fechas > Horas > Lugares" },
          { value: "weekday,times,skip,locations,byday-weekday+byweek+notes", label: "Laborable/Festivo > Horas > Lugares > Notas " },
          { value: "title,locations,skip,times,byday+byweek+notes", label: "Título > Lugares > Horas > Días" },
          { value: "byday,times,skip,title,notes", label: "Día > Hora > Titulo > Notas" },
          { value: "title,weekday,skip,times,byday-weekday+byweek+notes", label: "Titulo > Día > Horas > Notas" },
        ]
        # { value: "title""dates" "times""locations""byday""language""notes""weekday""byweek""empty"
  times:
    label: horas
    help: Hora en formato de 24 horas «HH:MM» (por ejemplo 18:30). Se puede escribir una hora que no esté en la lista.
    type: select
