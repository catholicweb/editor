  "typeScale":
    "label": ""
    "description": "Controls clamp()-based heading size scale. Independent of every other field — not derived from fontPair or spacingDensity, since neither reliably predicts the right heading scale (a font's ideal size is about its own character; a layout's density doesn't have to match its heading size). Not rendered as a selector in the guided flow: `vibe` sets it, and it's here mainly for power users / an advanced panel."
