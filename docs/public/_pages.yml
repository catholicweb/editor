          { value: "small", label: "Elementos pequeños (s)" },
          { value: "medium", label: "Elementos medianos (m)" },
          { value: "large", label: "Elementos grandes (l)" },
          { value: "xl", label: "Elementos muy grandes (xl)" },
          # Spacing
          { value: "dense", label: "Gaps estrechos" },
          { value: "spacious", label: "Gaps anchos" },
          { value: "cards", label: "Estilo tarjeta" },
          { value: "bordered", label: "Con bordes" },
          { value: "flat", label: "Sin sombra" },
          { value: "narrow", label: "Ancho estrecho" },
          { value: "fullbleed", label: "Ancho completo" },
          { value: "hidden", label: "Ocultar sección" },
        ]
  rrule:
    label: Fechas
    help: |-
      Cuándo se repite el evento. Para repetirlo cada semana elige los días (mo, tu, we, th, fr, sa, su; «ve» = vísperas; «mo,tu,we,th,fr» = lunes a viernes). Para limitarlo a ciertas semanas del mes añade week1–week5 (1ª a 5ª semana). Otras opciones: biweekly (cada dos semanas), monthly (cada mes) y yearly (cada año).
      «never» significa que no se repite: en ese caso rellena la fecha de inicio.
    type: select
    options:
      display: chips # one tappable chip per option instead of a dropdown
      multiple: true
      creatable: true
      exclusive: ["never"] # "No se repite" excludes every other value
      values:
        [
          { value: "mo", label: "Lun" },
          { value: "tu", label: "Mar" },
          { value: "we", label: "Mié" },
          { value: "th", label: "Jue" },
          { value: "fr", label: "Vie" },
          { value: "sa", label: "Sáb" },
          { value: "su", label: "Dom" },
          { value: "ve", label: "Vísperas" },
          { value: "mo,tu,we,th,fr", label: "Lun a vie" },
          { value: "yearly", label: "Cada año" },
          { value: "monthly", label: "Cada mes" },
          { value: "biweekly", label: "Cada 2 semanas" },
          { value: "week1", label: "1ª semana" },
          { value: "week2", label: "2ª semana" },
          { value: "week3", label: "3ª semana" },
          { value: "week4", label: "4ª semana" },
          { value: "week5", label: "5ª semana" },
          { value: "never", label: "No se repite" },
        ]
  hero:
    label: Hero
    type: object
    fields:
      - { name: title, label: Título, type: string }
      - { name: description, label: Subtitulo, type: string }
      - { name: image, label: Image, type: image }
      - name: elements
        label: Acciones
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
        fields:
          - { name: title, label: Título, type: string }
          - { name: link, label: Accion, type: string }
  gallery:
    label: Galleria imagenes
    type: object
    fields:
      - { name: title, label: Título, type: string }
      - { name: description, label: Subtitulo, type: string }
      - name: elements
        label: Elementos
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" }, sort: "manual", modal: false }
        fields:
          - { name: title, label: Título, type: string }
          - { name: description, label: Subtitulo, type: string }
          - { name: image, label: Imagen, type: image }
          #- { name: type, label: tipo de bloque, component: blocktype }
  event:
    label: Evento
    type: object
    fields:
      - { name: title, label: Título/Nombre del evento, type: string }
      - { name: images, label: Imagenes, type: image, options: { multiple: true } }
      - { name: location, label: Lugar, component: location }
      - name: date
        label: Fechas
        help: |-
          Fecha o fechas del evento (se guardan como lista, formato AAAA-MM-DD). Un evento puntual puede tener varias fechas (por ejemplo, las sesiones de un curso). Para quitar una fecha, pulsa la ✕ de su etiqueta; sin fechas, el evento usa las de su grupo.
          En un evento que se repite, la fecha más temprana es la de inicio: de ella dependen «Cada año», «Cada mes» y «Cada 2 semanas».
        type: date
        options: { multiple: true }
      - { name: times, label: Hora, component: times }
      - { name: rrule, label: Se repite, component: rrule }
      - { name: description, label: Nota breve, type: string }
      #- { name: duration, label: Duración (min), type: number }
  page:
    label: Página
    type: object
    fields:
        - { name: id, label: Identificador, type: uuid, hidden: true }
        - { name: title, label: Título, type: string }
        #- { name: description, label: Subtitulo, type: string }
        - { name: image, label: Imagen, type: image }
        #- { name: hideHero, label: Esconder cabezera por defecto, type: boolean, default: false }
        - { name: sections, label: Secciones, component: sections }

  sections:
    name: sections
    label: Secciones
    help: |-
      Contenido de la página como una lista de secciones; el orden de la lista es el orden en que aparecen en la web. Cada sección tiene un tipo (texto, preguntas frecuentes, galería, eventos, vídeo, mapa, campaña de financiación...) y solo admite los campos de ese tipo.
      Casi todas tienen un título y «Opciones de estilo». Los textos largos («Texto largo», respuestas de las preguntas frecuentes...) se escriben en Markdown. Para esconder una sección sin borrarla usa la opción de estilo «hidden».
    type: block
    list: { collapsible: { collapsed: true, summary: "{fields.title}" },  modal: false }
    blocks:
      - name: accordion
        label: FAQ
        help: "Preguntas frecuentes: cada elemento es una pregunta (título) con su respuesta en Markdown."
        fields:
          - { name: title, type: string, label: Titulo sección, default: "Preguntas frecuentes" }
          - name: elements
            label: Preguntas y respuestas
            type: object
            list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
            fields:
              - { name: title, label: Pregunta, type: string }
              - { name: html, label: Respuesta, type: rich-text }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: scrollyTelling
        label: Narración interactiva
        fields:
          - { name: title, type: string, label: Titulo de la narración }
          - name: elements
            label: Viñetas
            type: object
            list: { collapsible: { collapsed: true } }
            fields:
              - { name: text, label: Texto, type: rich-text }
              - { name: image, label: Imagen, type: image }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: gallery
        label: Galeria de imagenes
        fields:
          - { name: title, type: string, label: Titulo sección }
          - { name: images, type: image, label: Seleccion de imagenes, options: { multiple: true } }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: text
        label: Texto
        help: "Sección de texto libre: el contenido va en el campo «Texto largo», escrito en Markdown (no HTML)."
        modal: true # enabling this is a pending TODO
        fields:
          - { name: title, type: string, label: Titulo sección }
          - { name: html, label: Texto largo, type: rich-text }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: gospel
        label: Evangelio del día
        fields:
          - { name: title, type: string, label: Titulo sección, default: "Evangelio de hoy" }
          - { name: readings, label: Mostrar primera/segunda y salmo, type: boolean, default: false }
          - { name: audio, label: Añadir audio, type: boolean, default: false }
          - { name: images, label: Mostrar imagenes, type: boolean, default: true }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: calendar
        label: Eventos
        help: "Muestra eventos del calendario en tablas. Se elige qué eventos (Filtro); cómo se agrupan lo decide la web según ese filtro. Los eventos en sí se editan en la pestaña Eventos, no en esta sección."
        fields:
          - { name: title, type: string, label: Titulo sección, default: "Nuestros eventos" }
          - { name: filter, label: "Filtro. ¿Qué eventos quieres mostrar?", component: calendarFilter }
          # Legacy, hidden: kept so sites that already saved an ordering keep it (and keep validating).
          # Empty = web-template picks it from `filter` (see assembleOrder in web-template/docs/.vitepress/utils.js).
          - { name: ordering, label: "Agrupación de eventos (opcional)", component: ordering, hidden: true }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: video-gospel
        label: Audios Nuevo Testamento
        fields:
          - { name: title, type: string, label: Titulo sección, default: "Audios Nuevo Testamento" }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: video-podcast
        label: Podcast católicos
        fields:
          - { name: title, type: string, label: Titulo sección, default: "Descubre tu fe" }
          - { name: links, label: Podcast a incluir, component: podcast }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: video-channel
        label: Canal de Youtube
        fields:
          - { name: title, type: string, label: Titulo sección }
          - { name: filter, label: Filtro. Incluir solo videos que contengan, type: string }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: video-instagram
        label: Cuenta de instagram
        fields:
          - { name: title, type: string, label: Titulo sección }
          - { name: filter, label: Filtro. Incluir solo posts que contengan, type: string }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: town
        label: Lista de templos
        help: "Lista de los templos definidos en la pestaña Datos (Lista de templos). No lleva contenido propio: los templos se editan en Datos."
        fields:
          - { name: title, type: string, label: Titulo sección, default: "Nuestros pueblos" }
          - { name: filters, label: Filtros a mostrar, type: select, options: { multiple: true, creatable: true } }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: eventCards
        label: Lista de grupos parroquiales
        help: "Tarjetas de los grupos de eventos (grupos parroquiales) elegidos en «Eventos/grupos a mostrar». Los grupos se crean y editan en la pestaña Grupos de Eventos."
        fields:
          - { name: title, type: string, label: Titulo sección, default: "Nuestros parroquiales" }
          - { name: eventsToShow, label: "Eventos/grupos a mostrar", type: select, options: { source: "event-types.list", multiple: true, label: "{title}" }  }  
          - { name: filters, label: Filtros a mostrar, type: select, options: { multiple: true, creatable: true } }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: video
        label: Lista de videos/audios
        fields:
          - { name: title, type: string, label: Titulo sección }
          - { name: links, label: Enlaces externos, type: string, list: { collapsible: { collapsed: true } } }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: map
        label: Mapa
        help: "Mapa de un lugar. Las coordenadas se escriben como «latitud, longitud» (ej: 42.801941, -1.645660)."
        fields:
          - { name: title, type: string, label: Título sección, default: 'Ven a conocernos' }
          - { name: geo, type: string, label: "Coordenadas (ej: 42.801941, -1.645660)" }
          - { name: name, type: string, label: Nombre }
          - { name: image, type: image, label: Imagen }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: fundraising
        label: Campaña financiación
        help: "Campaña de financiación con barra de progreso: «Recaudado hasta la fecha» y «Total a recaudar» son números (sin símbolo de moneda) y la barra se calcula con ambos."
        fields:
          - { name: title, type: string, label: Titulo sección, default: "Ayudanos a llegar a más" }
          - { name: name, type: string, label: "Nombre causa (ej: Nuevo tejado)" }
          - { name: description, type: string, label: Descripcion }
          - { name: raised, type: number, label: Recaudado hasta la fecha }
          - { name: goal, type: number, label: Total a recaudar }
          - { name: action, type: string, label: Nombre acción, hidden: true, default: Donar }
          - { name: image, type: image, label: Imagen }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: hero
        label: Cabezera de sección
        component: hero
      - name: team
        label: Miembros del equipo
        fields:
          - { name: title, type: string, label: Titulo sección, default: "Nuestro equipo parroquial" }
          - { name: tags, label: Opciones de estilo, component: tags }
      - name: links
        label: Enlaces
        help: "Lista de enlaces a páginas de la web, que se eligen de Páginas > Lista de páginas (también se admite escribir una dirección)."
        fields:
          - { name: title, type: string, label: Titulo sección }
          - name: links
            label: "Lista de enlaces"
            type: select
            options: { source: "pages.list", multiple: true, label: "{title}", creatable: true }
          - { name: tags, label: Opciones de estilo, component: tags }


content:
  - name: calendar
    icon: calendar
    type: tab
    label: Eventos
    fields:
      # `calendario` is a custom field type rendered by CalendarEditor.vue
      # (see FieldRenderer's `field.type === 'calendario'` branch)
      - name: events
        type: calendario
        label: Calendario de eventos
        help: |-
          Calendario de eventos de la parroquia (misas, catequesis, confesiones...). Los eventos están en events.list. Cada evento pertenece a un grupo (campo «type»: el id de un elemento de event-types.list), uno o varios lugares (ids de templos de info.places) y, o bien una fecha de inicio (evento puntual), o bien una regla «Se repite» más hora (evento periódico).
          Para cambiar un evento, edita ese evento concreto (por su id) en vez de reescribir la lista entera.
        options:
          eventTypesPath: "event-types.list"   # config dot-path to the event-types array
          eventFields: "event"                 # components entry providing the event field set
          keyList: "list"                      # events doc sub-key holding the array
          keyDefaults: "defaults"              # events doc sub-key holding the per-type defaults map

  - name: event-types
    icon: false # this hides the tab
    type: tab
    label: Grupos de Eventos
    fields:
      - name: list
        label: Grupos de eventos
        help: |-
          Grupos de eventos (Eucaristía, Catequesis, Confesiones...). Cada evento del calendario pertenece a un grupo, guardado como el id de este elemento en el campo «type» del evento; por eso conviene no borrar un grupo que todavía tenga eventos.
          Los «valores por defecto» son el punto de partida para los eventos de este grupo.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.label}"
          sort: 'alphabetical'
        fields:
          - { name: id, label: Identificador, type: uuid, hidden: true }
          - { name: label, label: "Grupo de eventos (ej: Eucaristía)", type: string }
          - name: calendar
            label: "Calendario de Google a importar (opcional)"
            help: |-
              Enlace de un calendario de Google (u otro calendario .ics) cuyos eventos se importan automáticamente como eventos de este grupo, con los «valores por defecto» de abajo para lo que les falte (imagen, lugar, nota...). Así, todo lo que se añada a ese calendario aparece en la web sin tocar el editor.
              Admite: la «Dirección pública en formato iCal», el enlace público o de compartir del calendario, o su id (algo@group.calendar.google.com). El calendario debe ser público: este enlace es visible en la web, no uses la «dirección secreta».
              Se actualiza en cada publicación de la web.
            type: string
          - name: pageMode
            label: Crear página para eventos de este grupo
            help: |-
              none: los eventos solo aparecen en el calendario. type: se crea UNA página que agrupa todos los eventos de este grupo (lo habitual para un grupo con varias actividades, por ejemplo catequesis con muchas sesiones). event: se crea una página por cada evento (modo antiguo; solo si cada evento necesita su propia página).
              Las «Secciones de la página creada» solo se usan si el modo no es none.
            type: select
            options:
              multiple: false
              values:
                [
                  { value: none, label: "Sin página propia (solo aparecen en el calendario)" },
                  { value: type, label: "Crear una única página agrupando los eventos de este grupo" },
                  { value: event, label: "Crear una página para cada evento de este grupo" },
                ]
          - { name: sections, label: Secciones de la página creada, component: sections, showif: "pageMode != 'none'" } # TOOD: enable this or similar types of conditional rendering
          - { name: defaults, label: "Valores por defecto para eventos de este grupo", component: event }

  - name: nerdy
    icon: false # hidden tab: edit whole config as JSON
    type: tab
    label: Nerdy
    fields:
      - name: rawJson
        label: JSON completo
        type: text

  - name: info
    icon: identification
    type: tab
    label: Datos
    fields:
      - { name: title, label: Título del sitio web, type: string }
      - { name: description, label: Breve descripción del sitio web, type: text }

      - name: places
        label: Lista de templos
        help: |-
          Templos e iglesias de la parroquia. Cada uno puede tener su propia página en la web (opción «Crear una página para este lugar»), cuyo contenido son sus secciones. Los eventos y algunas secciones se refieren a un templo por su id.
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.name}" }, sort: "alphabetical", modal: false }
        fields:
          - { name: name, type: string, label: Nombre }
          - { name: images, type: image, label: Imagenes, options: { multiple: true } }
          - { name: geo, type: string, label: "Coordenadas (ej: 42.801941, -1.645660)" }
          - { name: address, type: string, label: "Dirección" }
          - { name: createPage, label: "Crear una página para este lugar", type: boolean, default: true }
          - { name: sections, label: Secciones de la página creada, component: sections, showif: "createPage == true" } # TOOD: enable this or similar types of conditional rendering

      - name: collaborators
        label: Lista de colaboradores
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.name}" } }
        fields:
          - { name: name, label: Nombre, type: string }
          - { name: phonenumber, label: "Número teléfono", type: string }
          - { name: image, label: Foto, type: image }
          - name: social
            label: Otra información de contacto (email, instagram....)
            type: string
            list: { collapsible: { collapsed: true } }

      - name: autodiscover
        label: Encontrar templos
        type: places-autodiscover
        options:
          listPath: "places"                   # field (relative to this tab) where selected places are appended
          eventsPath: "calendar.events.list"   # config dot-path to the events ARRAY to import into
      - name: bank
        label: Bizum y cuentas bancarias
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
        fields:
          - { name: title, label: "Nombre (ej: BIZUM/BBVA/...)", type: string }
          - { name: account, label: Número de cuenta/bizum, type: string }
      - name: social
        label: Redes sociales, youtube...
        type: string
        list: { collapsible: { collapsed: true } }

  - name: pages
    icon: document-text
    label: Páginas
    type: tab
    fields:
      - name: list
        label: Lista de páginas
        help: |-
          Páginas de la web. Cada página tiene título, imagen y una lista de secciones con su contenido. Las páginas de cada templo y de cada grupo de eventos se generan desde sus propias pestañas (Datos, Grupos de Eventos), no se añaden aquí.
        component: page
        list: { collapsible: { collapsed: true, summary: "{fields.title}" }, sort: "alphabetical", modal: false  }
      #- { name: pageperlocatoin, label: Crear una página para cada templo, type: boolean, default: true }  
      #- { name: pageperevent, label: "Crear una página para cada evento de tipo (OBSOLETO: usa «Página en la web» en cada tipo de evento)", type: select, options: { source: "event-types.list", multiple: true, label: "{title}" }  }  
      - name: nav
        label: Menu de navegación
        help: "Menú de navegación de la web: cada elemento es un submenú con un título y una lista de enlaces a páginas, que se eligen de Lista de páginas."
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
        fields:
          - { name: title, label: Titulo del submenu, type: string }
          - name: links
            label: Enlaces
            type: select
            options: { source: "pages.list", multiple: true, label: "{title}" }
      - name: languages
        label: Idiomas de la web
        component: languages

  - name: theme
    label: Diseño
    icon: fluent-mdl2:color-solid
    type: tab
    fields:
      - { name: image, label: Imagen del sitio, type: image }
      - { name: icon, label: Icono del sitio, type: image }
      - { name: accentHue, label: "Tono de color", component: accentHue, options: { themeRole: accent } }
      - { name: fontPair, label: "Tipografía", component: fontPair, options: { themeRole: font } }
      - { name: navStyle, label: "Estilo de cabezera", component: headerFooterStyle }
      - { name: radius, label: "Redondeo de esquinas", component: radius }
      - { name: spacingDensity, label: "Espaciado de elementos", component: spacingDensity }
      #- { name: surfaceStyle, label: "Estilos de superficie", component: surfaceStyle }
      #- { name: motionIntensity, label: "Dinamismo, efectos visuales", component: motionIntensity }
